name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom right of the window, for example v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you clicked, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: Paste the relevant lines from the Activity panel. Remove MAC addresses or public IPs you want to keep private.
      render: text
  - type: textarea
    id: crash
    attributes:
      label: Crash log
      description: If the app crashed, paste the contents of %TEMP%\Cre8Labs-IPSwitcher-crash.log
      render: text
