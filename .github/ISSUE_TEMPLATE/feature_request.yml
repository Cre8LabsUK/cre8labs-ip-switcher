name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job or situation, for example "I set up 20 cameras a day and need to..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: The feature or change you have in mind.
