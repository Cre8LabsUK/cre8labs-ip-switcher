name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used to publish releases on tag pushes
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = ([xml](Get-Content src/IPSwitcher.csproj)).Project.PropertyGroup |
              ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app and installer
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ip-switcher-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
